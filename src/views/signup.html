<div class="auth-page">
    <a href="#/" class="auth-home-link">
        <i class="ph ph-house"></i>
        Go to home
    </a>
    <div class="auth-card glass-card">
        <div class="auth-card-inner">
            <div class="brand-block">
                <a href="#/" class="brand-link">
                    <span class="brand-name">Scanify</span>
                </a>
                <h2 class="auth-title">Create your account</h2>
                <p class="auth-sub">Start generating QR codes for free.</p>
            </div>

            <div id="error-msg" class="alert-hidden" role="alert"></div>

            <form id="signup-form" class="auth-form">
                <div class="form-row">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" required autocomplete="name" class="form-input" placeholder="John Doe">
                </div>
                <div class="form-row">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" required autocomplete="email" class="form-input" placeholder="you@example.com">
                </div>
                <div class="form-row">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" required autocomplete="new-password" class="form-input" placeholder="Min. 6 characters">
                        <button type="button" id="password-toggle" class="password-toggle" aria-label="Show password" aria-pressed="false">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="primary-btn auth-submit">
                    Create Account <i class="ph ph-arrow-right"></i>
                </button>
            </form>
        </div>
        <div class="auth-card-footer">
            <p class="auth-footer-text">Already have an account? <a href="#/login" class="link-signup">Log in</a></p>
        </div>
    </div>
</div>
