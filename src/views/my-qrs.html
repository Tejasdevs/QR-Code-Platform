<div class="container qr-page">
    <div class="page-header actions-row">
        <div>
            <h1 class="page-title">My QR Codes</h1>
            <p class="page-sub">Manage all your generated QR codes.</p>
        </div>
        <a href="#/generator" class="primary-action">
            <i class="ph ph-plus-circle"></i> New QR Code
        </a>
    </div>

    <div class="search-row">
        <i class="ph ph-magnifying-glass search-icon" aria-hidden="true"></i>
        <input type="text" id="search-input" placeholder="Search QR codes..." class="search-input">
    </div>

    <div id="qr-grid" class="qr-grid">
    </div>

    <div id="empty-state" class="empty-state">
        <div class="empty-illustration">
            <i class="ph ph-folder-open"></i>
        </div>
        <h3 class="empty-title">No QR codes yet</h3>
        <p class="empty-sub">Create your first custom QR code and it will magically appear right here.</p>
        <a href="#/generator" class="primary-action">Create QR Code</a>
    </div>
</div>
