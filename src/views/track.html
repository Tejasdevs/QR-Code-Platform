<div class="track-page">
    <div class="page-header">
        <div>
            <div class="track-title-row">
                <h1 class="page-title">Track Scans</h1>
                <span class="track-status">Upcoming</span>
            </div>
            <p class="page-sub">Cloud-based real scan tracking will be available after deployment.</p>
        </div>
    </div>

    <section class="track-stats">
        <article class="track-stat-card">
            <p>Total Scans</p>
            <strong id="track-total">0</strong>
        </article>
        <article class="track-stat-card">
            <p>Today</p>
            <strong id="track-today">0</strong>
        </article>
        <article class="track-stat-card">
            <p>This Week</p>
            <strong id="track-week">0</strong>
        </article>
    </section>

    <section class="track-grid">
        <div class="track-panel">
            <div class="track-panel-header">
                <div>
                    <p class="dashboard-panel-kicker">Recent</p>
                    <h2 class="dashboard-panel-title">Recent Scans</h2>
                </div>
            </div>
            <div id="recent-scans" class="track-list"></div>
        </div>

        <div class="track-panel">
            <div class="track-panel-header">
                <div>
                    <p class="dashboard-panel-kicker">Performance</p>
                    <h2 class="dashboard-panel-title">QR Performance</h2>
                </div>
            </div>
            <div id="qr-performance" class="track-list"></div>
        </div>
    </section>
</div>
