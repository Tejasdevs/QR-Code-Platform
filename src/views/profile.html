<div class="profile-page">
    <div class="page-header profile-header">
        <div>
            <p class="dashboard-kicker">Account</p>
            <h1 class="page-title">Profile</h1>
        </div>
    </div>

    <section class="profile-card" aria-label="User profile information">
        <div class="profile-avatar" id="profile-avatar">U</div>

        <div class="profile-details">
            <div class="profile-info-row">
                <span>Full name</span>
                <strong id="profile-name">User</strong>
            </div>

            <div class="profile-info-row">
                <span>Email</span>
                <strong id="profile-email">user@example.com</strong>
            </div>

            <div class="profile-info-row">
                <span>Joined date</span>
                <strong id="profile-joined">Not available</strong>
            </div>
        </div>
    </section>

    <section class="profile-action-card" aria-label="Account actions">
        <div>
            <h3>Account access</h3>
            <p>Logout from this browser when you are done using Scanify.</p>
        </div>
        <button id="profile-logout-btn" class="profile-logout-btn" type="button">
            <i class="ph ph-sign-out icon-lg"></i>
            <span>Logout</span>
        </button>
    </section>
</div>
