<div class="max-w-2xl mx-auto space-y-8">
    <div>
        <h1 class="text-3xl font-bold text-white tracking-tight">Profile</h1>
        <p class="text-slate-400 mt-2 text-lg">Manage your personal information.</p>
    </div>

    <div class="glass-card rounded-3xl p-8">
        <div class="flex items-center gap-6 mb-10 pb-8 border-b border-white/5">
            <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 text-white flex items-center justify-center font-bold text-4xl shadow-lg shadow-purple-500/20" id="profile-avatar-large">U</div>
            <div>
                <h2 class="text-xl font-bold text-white mb-1" id="profile-name-display">User Name</h2>
                <p class="text-slate-400 mb-3" id="profile-email-display">user@example.com</p>
                <button class="premium-btn-secondary text-xs py-1.5 px-4"><i class="ph ph-camera"></i> Change Avatar</button>
            </div>
        </div>

        <form id="profile-form" class="space-y-6">
            <div id="profile-msg" class="hidden text-sm px-4 py-3 rounded-xl backdrop-blur-md shadow-lg" role="alert"></div>

            <div>
                <label for="profile-name" class="block text-sm font-medium text-slate-300 mb-2">Full Name</label>
                <input type="text" id="profile-name" class="premium-input" required>
            </div>
            <div>
                <label for="profile-email" class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                <input type="email" id="profile-email" class="premium-input" required readonly>
                <p class="text-[11px] text-slate-500 mt-2 uppercase tracking-widest font-semibold"><i class="ph ph-info"></i> Email cannot be changed</p>
            </div>

            <hr class="border-white/5 my-8">

            <h3 class="text-sm font-bold text-slate-300 mb-4 uppercase tracking-widest">Change Password</h3>
            <div>
                <label for="profile-password" class="block text-sm font-medium text-slate-300 mb-2">New Password (optional)</label>
                <input type="password" id="profile-password" class="premium-input" placeholder="Leave blank to keep current">
            </div>

            <div class="pt-4 flex justify-end">
                <button type="submit" class="premium-btn px-8">Save Changes</button>
            </div>
        </form>
    </div>
</div>
