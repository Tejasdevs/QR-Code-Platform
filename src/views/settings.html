<!-- src/views/settings.html -->
<div class="max-w-3xl mx-auto space-y-8">
    <div>
        <h1 class="text-3xl font-bold text-white tracking-tight">Settings</h1>
        <p class="text-slate-400 mt-2 text-lg">Customize your QRFlow experience.</p>
    </div>

    <div class="glass-card rounded-3xl p-8">
        <h3 class="text-sm font-bold text-slate-300 uppercase tracking-widest mb-6">Default Generator Settings</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Default QR Color</label>
                    <div class="flex items-center gap-3">
                        <input type="color" id="setting-color" class="h-12 w-16 rounded-xl cursor-pointer border border-white/10 p-1 bg-white/5">
                        <input type="text" id="setting-color-text" maxlength="7" class="premium-input font-mono uppercase">
                    </div>
                    <p class="text-[11px] text-slate-500 mt-2 uppercase tracking-widest font-semibold">Used for new QR codes</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Email Notifications</label>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <div class="relative">
                            <input type="checkbox" id="setting-email-notifs" class="sr-only peer">
                            <div class="w-11 h-6 bg-white/10 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-white/10 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500 shadow-inner"></div>
                        </div>
                        <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Receive weekly reports</span>
                    </label>
                </div>
            </div>
            
            <div class="bg-black/20 rounded-2xl p-6 border border-white/5">
                <h4 class="text-sm font-bold text-white mb-4">Preview</h4>
                <div class="w-full aspect-square bg-white rounded-xl flex items-center justify-center border border-white/10 relative overflow-hidden">
                    <i class="ph-fill ph-qr-code text-[120px] absolute" id="setting-preview-qr" style="color: #ffffff"></i>
                </div>
            </div>
        </div>

        <hr class="border-white/5 my-8">

        <h3 class="text-sm font-bold text-slate-300 uppercase tracking-widest mb-6">Danger Zone</h3>
        <div class="bg-red-900/10 border border-red-500/20 rounded-2xl p-6">
            <h4 class="text-white font-bold mb-2">Clear All Data</h4>
            <p class="text-slate-400 text-sm mb-4">Permanently delete all your QR codes and history from this browser.</p>
            <button id="clear-data-btn" class="bg-red-500/20 hover:bg-red-500/40 text-red-400 border border-red-500/30 px-6 py-2.5 rounded-xl text-sm font-semibold transition-colors">Clear Data</button>
        </div>

        <div id="settings-msg" class="mt-6 hidden px-4 py-3 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-xl text-sm font-medium text-center" role="alert"></div>
    </div>
</div>
