<div class="settings-wrap">
    <div class="page-header">
        <h1 class="page-title">Settings</h1>
        <p class="page-sub">Customize your Scanify experience.</p>
    </div>

    <div class="glass-card settings-card">
        <h3 class="section-title">Default Generator Settings</h3>

        <div class="settings-stack">
            <div class="setting-row">
                <label class="form-label">Default QR Color</label>
                <div class="color-row">
                    <input type="color" id="setting-color" class="color-picker">
                    <input type="text" id="setting-color-text" maxlength="7" class="color-text">
                </div>
                <p class="note">Used for new QR codes</p>
            </div>

            <div class="settings-preview">
                <h4 class="preview-title">Preview</h4>
                <div class="preview-box">
                    <i class="ph-fill ph-qr-code preview-qr" id="setting-preview-qr" style="color: #ffffff"></i>
                </div>
            </div>
        </div>

        <hr class="divider">

        <h3 class="section-title">Danger Zone</h3>
        <div class="danger-box">
            <div>
                <h4 class="danger-title">Clear All Data</h4>
                <p class="danger-text">Permanently delete all your QR codes and history from this browser.</p>
            </div>
            <button id="clear-data-btn" class="danger-btn">Clear Data</button>
        </div>

        <div id="settings-msg" class="settings-msg" role="alert"></div>
    </div>
</div>
