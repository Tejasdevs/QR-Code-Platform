<div class="auth-page">
    <div class="auth-card glass-card">
        <div class="auth-card-inner">
            <div class="brand-block">
                <a href="#/" class="brand-link">
                    <i class="ph-fill ph-qr-code brand-icon"></i>
                    <span class="brand-name">QRFlow</span>
                </a>
                <h2 class="auth-title">Welcome back</h2>
                <p class="auth-sub">Log in to manage your QR codes.</p>
            </div>

            <div id="error-msg" class="alert-hidden" role="alert"></div>

            <form id="login-form" class="auth-form">
                <div class="form-row">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" required autocomplete="email" class="form-input" placeholder="you@example.com">
                </div>
                <div class="form-row">
                    <div class="form-row-top">
                        <label for="password" class="form-label">Password</label>
                        <a href="#" class="link-forgot">Forgot password?</a>
                    </div>
                    <input type="password" id="password" required autocomplete="current-password" class="form-input" placeholder="••••••••">
                </div>
                <button type="submit" id="login-submit" class="primary-btn auth-submit">
                    Log in <i class="ph ph-sign-in"></i>
                </button>
            </form>
        </div>
        <div class="auth-card-footer">
            <p class="auth-footer-text">Don't have an account? <a href="#/signup" class="link-signup">Sign up</a></p>
        </div>
    </div>
</div>
