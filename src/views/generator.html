<div class="container">
    <div class="page-header">
        <h1 class="page-title">QR Code Generator</h1>
        <p class="page-sub">Create and customize your QR code below.</p>
    </div>

    <div class="generator-layout">

        <div class="generator-form">
            <div class="glass-card form-card">

                <div class="form-section">
                    <label class="form-label">Data Type</label>
                    <div class="type-grid">
                        <label class="type-option">
                            <input type="radio" name="qr_type" value="URL" class="type-input" checked>
                            <div class="type-body">
                                <i class="ph ph-link type-icon"></i>
                                <span class="type-text">URL</span>
                            </div>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="qr_type" value="Text" class="type-input">
                            <div class="type-body">
                                <i class="ph ph-text-t type-icon"></i>
                                <span class="type-text">Text</span>
                            </div>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="qr_type" value="WhatsApp" class="type-input">
                            <div class="type-body">
                                <i class="ph ph-whatsapp-logo type-icon"></i>
                                <span class="type-text">WhatsApp</span>
                            </div>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="qr_type" value="WiFi" class="type-input">
                            <div class="type-body">
                                <i class="ph ph-wifi-high type-icon"></i>
                                <span class="type-text">WiFi</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div id="dynamic-inputs" class="dynamic-inputs"></div>

                <hr class="divider">

                <h3 class="form-section-title">Customization</h3>
                <div class="custom-grid">
                    <div class="custom-item">
                        <label class="form-label">QR Color</label>
                        <div class="color-row">
                            <input type="color" id="qr-color" value="#ffffff" class="color-picker">
                            <input type="text"  id="qr-color-text" value="#ffffff" maxlength="7" class="color-text">
                        </div>
                    </div>
                    <div class="custom-item">
                        <label class="form-label">Background</label>
                        <div class="color-row">
                            <input type="color" id="qr-bg" value="#0f172a" class="color-picker">
                            <input type="text"  id="qr-bg-text" value="#0f172a" maxlength="7" class="color-text">
                        </div>
                    </div>
                </div>

                <button id="generate-btn" class="primary-btn generate-btn">
                    <i class="ph ph-magic-wand"></i> Generate QR Code
                </button>
            </div>
        </div>

        <aside class="preview-column">
            <div class="glass-card preview-card">
                <h3 class="preview-title">Live Preview</h3>

                <div id="qr-preview-container" class="qr-preview">
                    <div id="qrcode"></div>
                    <div id="qr-placeholder" class="qr-placeholder">
                        <i class="ph ph-qr-code preview-icon"></i>
                        <span class="preview-text">Preview Area</span>
                    </div>
                </div>

                <div id="qr-actions" class="qr-actions hidden">
                    <button id="save-qr-btn" class="btn-save">
                        <i class="ph ph-floppy-disk"></i> Save to Dashboard
                    </button>
                    <button id="download-png" class="secondary-btn">
                        <i class="ph ph-download-simple"></i> Download PNG
                    </button>
                </div>

                <div id="save-success" class="save-success hidden">
                    <i class="ph-fill ph-check-circle"></i> Saved successfully!
                </div>
            </div>
        </aside>
    </div>
</div>
