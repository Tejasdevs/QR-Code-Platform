<div class="dashboard-page dashboard-dark">
    <div class="dashboard-shell">
        <section class="dashboard-hero">
            <div class="dashboard-hero-copy">
                <p class="dashboard-kicker">Dashboard</p>
                <h1 class="dashboard-title dashboard-title-with-avatar">
                    <span class="dashboard-title-copy">
                        <span class="dashboard-title-line"><span id="greeting-text">Welcome back</span>,</span>
                        <span id="user-name" class="dashboard-user-name">User</span>
                    </span>
                    <a href="#/profile" class="dashboard-profile-link" aria-label="Open profile">
                        <span id="dashboard-profile-avatar" class="dashboard-profile-avatar">U</span>
                    </a>
                </h1>
                <p class="dashboard-subtitle">Create, manage, and review every QR code from one clean workspace.</p>
            </div>

            <div class="dashboard-actions">
                <a href="#/my-qrs" class="dashboard-secondary-action">
                    <i class="ph ph-folder-simple"></i>
                    Manage QRs
                </a>
                <a href="#/generator" class="dashboard-primary-action">
                    <i class="ph ph-plus-circle"></i>
                    Create QR
                </a>
            </div>
        </section>

        <section class="dashboard-stats" aria-label="QR code overview">
            <article class="dashboard-stat-card">
                <div class="dashboard-stat-icon accent-blue">
                    <i class="ph ph-qr-code"></i>
                </div>
                <div>
                    <p class="dashboard-stat-label">Total QR Codes</p>
                    <h2 id="stat-total" class="dashboard-stat-value">0</h2>
                </div>
            </article>

            <article class="dashboard-stat-card">
                <div class="dashboard-stat-icon accent-purple">
                    <i class="ph ph-link"></i>
                </div>
                <div>
                    <p class="dashboard-stat-label">Website QRs</p>
                    <h2 id="stat-url" class="dashboard-stat-value">0</h2>
                </div>
            </article>

            <article class="dashboard-stat-card">
                <div class="dashboard-stat-icon accent-emerald">
                    <i class="ph ph-whatsapp-logo"></i>
                </div>
                <div>
                    <p class="dashboard-stat-label">WhatsApp QRs</p>
                    <h2 id="stat-whatsapp" class="dashboard-stat-value">0</h2>
                </div>
            </article>

            <article class="dashboard-stat-card">
                <div class="dashboard-stat-icon accent-rose">
                    <i class="ph ph-wifi-high"></i>
                </div>
                <div>
                    <p class="dashboard-stat-label">WiFi QRs</p>
                    <h2 id="stat-wifi" class="dashboard-stat-value">0</h2>
                </div>
            </article>
        </section>

        <section class="dashboard-workspace">
            <div class="dashboard-main-panel">
                <div class="dashboard-panel-header">
                    <div>
                        <p class="dashboard-panel-kicker">Latest</p>
                        <h2 class="dashboard-panel-title">Recent QR Codes</h2>
                    </div>
                    <a href="#/my-qrs" class="dashboard-panel-link">View all</a>
                </div>
                <div id="recent-qrs" class="dashboard-list">
                    <div class="dashboard-empty-state">
                        <i class="ph ph-qr-code"></i>
                        <div>
                            <p>No QR codes yet</p>
                            <span>Create your first QR and it will appear here.</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
